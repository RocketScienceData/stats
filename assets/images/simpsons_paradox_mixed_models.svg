<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-simp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="880" height="380" rx="20" fill="url(#bg-simp)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Left: The Paradox Chart Visualizer -->
  <g transform="translate(35, 30)">
    <rect width="450" height="320" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Title -->
    <text x="25" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Simpson's Paradox: Data Aggregatie vs Realiteit</text>
    <text x="25" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Sporturen (X) versus Cholesterolgehalte (Y)</text>

    <!-- Chart Axes -->
    <line x1="50" y1="260" x2="420" y2="260" stroke="#475569" stroke-width="1.5"/>
    <line x1="50" y1="70" x2="50" y2="260" stroke="#475569" stroke-width="1.5"/>
    <text x="420" y="278" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">Sporturen per week →</text>
    <text x="35" y="65" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" transform="rotate(-90, 35, 65)">Cholesterol →</text>

    <!-- Cluster 1: Youth (Low X, Low Y, Downward slope) -->
    <!-- X: 70..150, Y: 210..250 -->
    <g fill="#38bdf8" opacity="0.85">
      <circle cx="70" cy="225" r="4.5"/><circle cx="85" cy="235" r="4.5"/><circle cx="95" cy="220" r="4.5"/>
      <circle cx="110" cy="245" r="4.5"/><circle cx="125" cy="240" r="4.5"/><circle cx="140" cy="255" r="4.5"/>
    </g>
    <!-- Cluster 1 Fit Line -->
    <line x1="60" y1="220" x2="155" y2="258" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="160" y="258" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Jongeren (β = -0.78)</text>

    <!-- Cluster 2: Middle Age (Medium X, Medium Y, Downward slope) -->
    <g fill="#a855f7" opacity="0.85">
      <circle cx="170" cy="155" r="4.5"/><circle cx="190" cy="165" r="4.5"/><circle cx="205" cy="150" r="4.5"/>
      <circle cx="225" cy="175" r="4.5"/><circle cx="240" cy="170" r="4.5"/><circle cx="260" cy="185" r="4.5"/>
    </g>
    <!-- Cluster 2 Fit Line -->
    <line x1="160" y1="150" x2="275" y2="188" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
    <text x="280" y="188" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Middelbaar (β = -0.78)</text>

    <!-- Cluster 3: Seniors (High X, High Baseline Y, Downward slope) -->
    <g fill="#34d399" opacity="0.85">
      <circle cx="280" cy="85" r="4.5"/><circle cx="305" cy="95" r="4.5"/><circle cx="320" cy="80" r="4.5"/>
      <circle cx="345" cy="105" r="4.5"/><circle cx="360" cy="100" r="4.5"/><circle cx="380" cy="115" r="4.5"/>
    </g>
    <!-- Cluster 3 Fit Line -->
    <line x1="270" y1="80" x2="395" y2="118" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <text x="370" y="78" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Senioren (β = -0.78)</text>

    <!-- POOLED OLS LINE (Misleading Positive Slope) -->
    <line x1="70" y1="240" x2="385" y2="90" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6,6"/>
    
    <!-- Warning Badge -->
    <rect x="75" y="115" width="220" height="26" rx="6" fill="#881337" fill-opacity="0.9" stroke="#f43f5e" stroke-width="1"/>
    <text x="185" y="132" fill="#ffe4e6" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">⚠️ Gepoolde OLS: β = +0.54 (Misleidend!)</text>
  </g>

  <!-- Right: The Mixed Models Architectural Solution -->
  <g transform="translate(510, 30)">
    <rect width="335" height="320" rx="16" fill="url(#card-grad)" stroke="#6366f1" stroke-width="1.5"/>
    
    <rect x="25" y="24" width="105" height="20" rx="10" fill="#4f46e5" fill-opacity="0.3" stroke="#6366f1" stroke-width="1"/>
    <text x="77" y="38" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">DE OPLOSSING</text>
    
    <text x="25" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800">Linear Mixed Model (LMM)</text>
    <text x="25" y="86" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Fase 3: De Praktische Sweet Spot</text>

    <!-- Hierarchical Structure Diagram -->
    <g transform="translate(25, 105)">
      <!-- Level 2: Cluster Box -->
      <rect width="285" height="72" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
      <text x="15" y="22" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Cluster Niveau (Tussen Groepen)</text>
      <text x="15" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Random Intercepts (u₀ⱼ) &amp; Slopes (u₁ⱼ)</text>
      <text x="15" y="58" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">u₀ⱼ ~ 𝒩(0, σ²_u0)  •  u₁ⱼ ~ 𝒩(0, σ²_u1)</text>
    </g>

    <!-- Arrows connecting levels -->
    <path d="M 167 177 L 167 197" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="167" y1="180" x2="167" y2="198" stroke="#818cf8" stroke-width="2"/>
    <polygon points="163,195 167,203 171,195" fill="#818cf8"/>

    <!-- Level 1: Individual Box -->
    <g transform="translate(25, 205)">
      <rect width="285" height="60" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
      <text x="15" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Individueel Niveau (Binnen Groepen)</text>
      <text x="15" y="42" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="700">εᵢⱼ ~ 𝒩(0, σ²_e)  •  Ware Effect β = -0.78</text>
    </g>

    <!-- Formula at bottom -->
    <rect x="25" y="280" width="285" height="30" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="167" y="300" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" text-anchor="middle">Yᵢⱼ = (β₀ + u₀ⱼ) + (β₁ + u₁ⱼ)Xᵢⱼ + εᵢⱼ</text>
  </g>
</svg>
