<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a13"/>
    </linearGradient>
    <linearGradient id="flow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="g-em" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="g-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="g-ind" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="g-pur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow-p1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="320" rx="20" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="15" y="15" width="970" height="290" rx="14" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="4,6" opacity="0.4"/>

  <!-- Connecting Stream Line -->
  <path d="M 140 160 C 270 160, 270 160, 380 160 C 500 160, 500 160, 620 160 C 740 160, 740 160, 860 160" fill="none" stroke="url(#flow-line)" stroke-width="3" opacity="0.6"/>
  <path d="M 140 160 L 860 160" fill="none" stroke="url(#flow-line)" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.8"/>

  <!-- Phase 1 Card -->
  <g transform="translate(40, 45)">
    <rect width="200" height="230" rx="14" fill="url(#g-em)" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="100" cy="40" r="24" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <!-- Bell Curve icon -->
    <path d="M 85 48 C 92 48, 95 30, 100 28 C 105 30, 108 48, 115 48" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="68" y="76" width="64" height="18" rx="9" fill="#10b981" fill-opacity="0.2"/>
    <text x="100" y="89" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">LEVELS 1–5</text>
    <text x="100" y="118" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Fundamenten</text>
    <text x="100" y="136" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Gauss, CLT &amp; Power</text>
    <path d="M 25 155 L 175 155" stroke="#1e293b" stroke-width="1"/>
    <text x="100" y="176" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="middle">Centrummaten &amp; Scheefheid</text>
    <text x="100" y="196" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="middle">Betrouwbaarheidsintervallen</text>
    <text x="100" y="216" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">SE = σ / √N</text>
  </g>

  <!-- Phase 2 Card -->
  <g transform="translate(280, 45)">
    <rect width="200" height="230" rx="14" fill="url(#g-sky)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="100" cy="40" r="24" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <!-- OLS Scatter & Line icon -->
    <circle cx="89" cy="46" r="2.5" fill="#7dd3fc"/>
    <circle cx="96" cy="38" r="2.5" fill="#7dd3fc"/>
    <circle cx="104" cy="42" r="2.5" fill="#7dd3fc"/>
    <circle cx="112" cy="32" r="2.5" fill="#7dd3fc"/>
    <line x1="84" y1="48" x2="116" y2="30" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="66" y="76" width="68" height="18" rx="9" fill="#0284c7" fill-opacity="0.25"/>
    <text x="100" y="89" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">LEVELS 6–12</text>
    <text x="100" y="118" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Klassiek &amp; GLM</text>
    <text x="100" y="136" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">OLS &amp; Diagnostiek</text>
    <path d="M 25 155 L 175 155" stroke="#1e293b" stroke-width="1"/>
    <text x="100" y="176" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="middle">Residu-Analyse (L.I.N.E.)</text>
    <text x="100" y="196" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="middle">Multicollineariteit &amp; VIF</text>
    <text x="100" y="216" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">VIF = 1/(1 - R²)</text>
  </g>

  <!-- Phase 3 Card (SWEET SPOT) -->
  <g transform="translate(520, 35)">
    <!-- Elevated / Spotlight Glow -->
    <rect width="200" height="250" rx="14" fill="url(#g-ind)" stroke="#6366f1" stroke-width="2.5" filter="url(#glow-p1)"/>
    <rect width="200" height="250" rx="14" fill="#0f172a" fill-opacity="0.95" stroke="#818cf8" stroke-width="2"/>
    <circle cx="100" cy="42" r="25" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
    <!-- Hierarchical Cluster icon -->
    <circle cx="100" cy="30" r="4" fill="#a5b4fc"/>
    <line x1="100" y1="34" x2="88" y2="48" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="100" y1="34" x2="112" y2="48" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="88" cy="50" r="3" fill="#c7d2fe"/>
    <circle cx="112" cy="50" r="3" fill="#c7d2fe"/>
    
    <rect x="52" y="80" width="96" height="20" rx="10" fill="#4f46e5" fill-opacity="0.4" stroke="#6366f1" stroke-width="1"/>
    <text x="100" y="94" fill="#fde047" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">⭐ SWEET SPOT (13–18)</text>
    <text x="100" y="125" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="800" text-anchor="middle">Mixed Models</text>
    <text x="100" y="144" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Random Effects &amp; ICC</text>
    <path d="M 25 163 L 175 163" stroke="#334155" stroke-width="1"/>
    <text x="100" y="184" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="middle">Geclusterde Data &amp; Longitudinaal</text>
    <text x="100" y="204" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="middle">Shrinkage &amp; Partial Pooling</text>
    <text x="100" y="228" fill="#a5b4fc" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">ICC = σ²_u / (σ²_u + σ²_e)</text>
  </g>

  <!-- Phase 4 Card -->
  <g transform="translate(760, 45)">
    <rect width="200" height="230" rx="14" fill="url(#g-pur)" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="100" cy="40" r="24" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
    <!-- Manifold / Infinity icon -->
    <path d="M 86 40 C 86 35, 93 35, 96 40 C 99 45, 106 45, 106 40 C 106 35, 99 35, 96 40 C 93 45, 86 45, 86 40 Z" fill="none" stroke="#e9d5ff" stroke-width="2.5"/>
    <rect x="66" y="76" width="68" height="18" rx="9" fill="#9333ea" fill-opacity="0.3"/>
    <text x="100" y="89" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">LEVELS 19–24</text>
    <text x="100" y="118" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Apex Grenzen</text>
    <text x="100" y="136" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Bayes, DAGs &amp; SDEs</text>
    <path d="M 25 155 L 175 155" stroke="#1e293b" stroke-width="1"/>
    <text x="100" y="176" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="middle">MCMC Inferentie &amp; Priors</text>
    <text x="100" y="196" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" text-anchor="middle">Causale DAGs &amp; Manifolds</text>
    <text x="100" y="216" fill="#c084fc" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" text-anchor="middle">dX_t = -∇Φ dt + σ dB</text>
  </g>
</svg>
