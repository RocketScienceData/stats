<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-comp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="g-trad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="g-our" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="880" height="360" rx="20" fill="url(#bg-comp)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Left: The Old Way -->
  <g transform="translate(35, 30)">
    <rect width="385" height="300" rx="16" fill="url(#g-trad)" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.5"/>
    
    <div xmlns="http://www.w3.org/1999/xhtml"></div>
    <rect x="25" y="24" width="85" height="22" rx="11" fill="#7f1d1d" fill-opacity="0.5" stroke="#ef4444" stroke-width="1"/>
    <text x="67" y="39" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">❌ HET OUDE SYSTEEM</text>
    
    <text x="25" y="72" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Frustratie, Codefouten &amp; Dogma</text>
    <text x="25" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Hoe universiteiten en bootcamps statistiek doceren</text>

    <!-- Visual of code error traceback -->
    <g transform="translate(25, 110)">
      <rect width="335" height="85" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
      <circle cx="16" cy="16" r="3.5" fill="#ef4444"/>
      <circle cx="28" cy="16" r="3.5" fill="#f59e0b"/>
      <circle cx="40" cy="16" r="3.5" fill="#10b981"/>
      <text x="14" y="42" fill="#ef4444" font-family="ui-monospace, monospace" font-size="10" font-weight="600">Error in lmer(y ~ x + (1|group)):</text>
      <text x="14" y="58" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="9.5">boundary (singular) fit: see help('isSingular')</text>
      <text x="14" y="74" fill="#71717a" font-family="ui-monospace, monospace" font-size="9.5">80% van de tijd kwijt aan package installaties</text>
    </g>

    <text x="25" y="222" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11.5">• Droge 600-pagina formules zonder visuele link</text>
    <text x="25" y="244" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11.5">• Blind p-waarden nastreven zonder aannames te checken</text>
    <text x="25" y="266" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11.5">• Hoge kosten ($2.000+) achter gesloten betaalmuren</text>
  </g>

  <!-- VS Badge in middle -->
  <circle cx="440" cy="180" r="24" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
  <text x="440" y="185" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="13" font-weight="900" text-anchor="middle">VS</text>

  <!-- Right: The Statistical Journey Way -->
  <g transform="translate(460, 30)">
    <rect width="385" height="300" rx="16" fill="url(#g-our)" stroke="#10b981" stroke-width="1.8"/>
    
    <rect x="25" y="24" width="95" height="22" rx="11" fill="#064e3b" fill-opacity="0.8" stroke="#10b981" stroke-width="1"/>
    <text x="72" y="39" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">✓ STATISTICAL JOURNEY</text>
    
    <text x="25" y="72" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">100% Intuïtie &amp; Dynamische Labs</text>
    <text x="25" y="90" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Interactief leren zonder codeerfrictie</text>

    <!-- Visual of interactive slider and curve -->
    <g transform="translate(25, 110)">
      <rect width="335" height="85" rx="8" fill="#06251b" stroke="#10b981" stroke-width="1"/>
      <!-- mini slider bar -->
      <text x="14" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Parametrische Schuifregelaar: Cohen's d = 0.80</text>
      <rect x="14" y="32" width="220" height="6" rx="3" fill="#0f172a"/>
      <rect x="14" y="32" width="160" height="6" rx="3" fill="#10b981"/>
      <circle cx="174" cy="35" r="7" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
      <!-- mini power curve -->
      <path d="M 245 65 C 265 65, 275 25, 290 25 C 305 25, 315 65, 330 65" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <text x="14" y="60" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="10" font-weight="700">Power (1 - β) = 88.4%  •  Type II Fout = 11.6%</text>
      <text x="14" y="76" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Direct visuele feedback bij elke verandering</text>
    </g>

    <text x="25" y="222" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11.5">• 24 Live interactieve simulators met directe herberekening</text>
    <text x="25" y="244" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11.5">• Valkuil-detectors: multicollineariteit, ICC en p-hacking</text>
    <text x="25" y="266" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11.5">• 100% Gratis en Open Toegang voor iedereen wereldwijd</text>
  </g>
</svg>
