<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-dag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-pur" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="280" rx="18" fill="url(#bg-dag)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Left: Observational DAG -->
  <g transform="translate(40, 25)">
    <rect width="360" height="230" rx="14" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1.2"/>
    <text x="25" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. Passieve Observatie: Confounded DAG</text>
    <text x="25" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Associatie P(Y | X) ≠ Causaliteit P(Y | do(X))</text>

    <!-- Confounder Z -->
    <circle cx="180" cy="85" r="22" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
    <text x="180" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Z</text>
    <text x="180" y="122" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Confounder (bijv. Leeftijd)</text>

    <!-- Treatment X -->
    <circle cx="90" cy="175" r="22" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">X</text>
    <text x="90" y="210" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Behandeling</text>

    <!-- Outcome Y -->
    <circle cx="270" cy="175" r="22" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="270" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Y</text>
    <text x="270" y="210" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Uitkomst</text>

    <!-- Edges -->
    <line x1="162" y1="98" x2="108" y2="158" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    <line x1="198" y1="98" x2="252" y2="158" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="115" y1="175" x2="245" y2="175" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="180" y="195" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Backdoor Pad Besmetting!</text>
  </g>

  <!-- Right: Interventional DAG (Graph Surgery) -->
  <g transform="translate(480, 25)">
    <rect width="360" height="230" rx="14" fill="#1e293b" fill-opacity="0.5" stroke="#10b981" stroke-width="1.5"/>
    <text x="25" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. Causale Interventie: do(X = x)</text>
    <text x="25" y="48" fill="#34d399" font-family="system-ui, sans-serif" font-size="10.5">Pearl's Graph Surgery Knipt Confounding Door</text>

    <!-- Confounder Z -->
    <circle cx="180" cy="85" r="22" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="180" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Z</text>

    <!-- Treatment X under do(X) -->
    <circle cx="90" cy="175" r="24" fill="#047857" stroke="#34d399" stroke-width="2.5"/>
    <text x="90" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">do(X)</text>
    <text x="90" y="212" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Interventie</text>

    <!-- Outcome Y -->
    <circle cx="270" cy="175" r="22" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="270" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Y</text>

    <!-- CUT ARROW WITH SCISSORS -->
    <line x1="162" y1="98" x2="108" y2="158" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.3"/>
    <g transform="translate(130, 120)">
      <circle cx="0" cy="0" r="14" fill="#991b1b" stroke="#f87171" stroke-width="1.2"/>
      <text x="0" y="4" fill="#ffffff" font-size="12" text-anchor="middle">✂️</text>
    </g>

    <line x1="198" y1="98" x2="252" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- Clean causal arrow -->
    <line x1="117" y1="175" x2="245" y2="175" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-green)"/>
    <text x="180" y="195" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">Zuiver Causal Effect P(Y | do(X))</text>
  </g>
</svg>
